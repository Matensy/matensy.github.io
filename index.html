<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matensy — Portfolio</title>
  <meta name="description" content="Matensy — Cybersecurity Student & Hack The Box Player">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0c0c0c;
      --surface:      #141414;
      --header-bg:    #0f0f0f;
      --border:       #222222;
      --accent:       #a855f7;
      --accent-soft:  rgba(168, 85, 247, 0.12);
      --text:         #d0d0d0;
      --text-dim:     #909090;
      --text-muted:   #505050;
      --green:        #4ade80;
      --yellow:       #fbbf24;
      --red:          #f87171;
      --pink:         #e879f9;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Terminal Window ── */
    .terminal {
      position: relative;
      z-index: 1;
      width: min(860px, 100vw);
      height: min(680px, 100vh);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 0 1px rgba(168,85,247,0.1),
        0 30px 80px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    /* ── Title Bar ── */
    .t-bar {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 16px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }

    .t-dots { display: flex; gap: 7px; }
    .t-dot  { width: 12px; height: 12px; border-radius: 50%; }
    .t-dot.r { background: #ff5f57; }
    .t-dot.y { background: #ffbd2e; }
    .t-dot.g { background: #28c840; }

    .t-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .t-bar-spacer { width: 46px; }

    /* ── Scroll Body ── */
    .t-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 26px 8px;
      font-size: 14px;
      line-height: 1.75;
      cursor: text;
    }

    .t-body::-webkit-scrollbar { width: 4px; }
    .t-body::-webkit-scrollbar-track { background: transparent; }
    .t-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Output Blocks ── */
    .out-block {
      margin-bottom: 20px;
      animation: fadeIn 0.15s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .out-cmd-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .out-ps1  { color: var(--accent); font-weight: 700; user-select: none; flex-shrink: 0; }
    .out-cmd  { color: var(--text); }

    /* ── Content Atoms ── */
    .sec-title {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .kv-row { display: flex; margin-bottom: 4px; }
    .kv-key { color: var(--accent); min-width: 120px; flex-shrink: 0; }
    .kv-sep { color: var(--text-muted); margin-right: 8px; }
    .kv-val { color: var(--text); }
    .kv-val a { color: var(--accent); text-decoration: none; }
    .kv-val a:hover { text-decoration: underline; }

    .bio {
      margin-top: 16px;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.9;
      border-left: 2px solid var(--border);
      padding-left: 14px;
      max-width: 580px;
    }

    /* Help */
    .help-row { display: flex; margin-bottom: 4px; }
    .help-cmd  { color: var(--accent); min-width: 120px; flex-shrink: 0; }
    .help-desc { color: var(--text-dim); }

    /* Skills */
    .skill-group { margin-bottom: 14px; }
    .skill-group-title {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }
    .skill-entry { color: var(--text); margin-bottom: 3px; }
    .skill-entry::before { content: '→ '; color: var(--accent); }

    /* Projects */
    .proj-item { margin-bottom: 14px; }
    .proj-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
    .proj-name   { color: var(--accent); font-weight: 600; }
    .diff-easy   { color: var(--green); font-size: 12px; }
    .diff-medium { color: var(--yellow); font-size: 12px; }
    .diff-hard   { color: var(--red); font-size: 12px; }
    .diff-insane { color: var(--pink); font-size: 12px; }
    .proj-topics { color: var(--text-muted); font-size: 12px; }

    /* Experience */
    .exp-item { margin-bottom: 16px; border-left: 2px solid var(--border); padding-left: 14px; }
    .exp-role    { color: var(--accent); font-weight: 600; }
    .exp-company { color: var(--text); }
    .exp-period  { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }
    .exp-bullet  { color: var(--text-dim); font-size: 13px; }
    .exp-bullet::before { content: '· '; color: var(--accent); }

    /* Error */
    .err { color: var(--red); }

    /* Welcome */
    .welcome-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .welcome-role  { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
    .welcome-hint  { color: var(--text-muted); font-size: 12px; }

    /* ── Input Line ── */
    .input-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 14px;
    }

    .in-ps1 {
      color: var(--accent);
      font-weight: 700;
      flex-shrink: 0;
      user-select: none;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      caret-color: var(--accent);
    }

    #cmd-input::placeholder { color: var(--text-muted); }

    /* ── Footer ── */
    .t-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 26px;
      border-top: 1px solid var(--border);
      background: var(--header-bg);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .try-lbl { color: var(--text-muted); font-size: 12px; }

    .q-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .q-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      body { overflow: auto; align-items: flex-start; }
      .terminal { width: 100vw; height: 100svh; border-radius: 0; border: none; }
      .t-body { font-size: 13px; padding: 14px 16px 8px; }
      .kv-key  { min-width: 90px; }
      .help-cmd { min-width: 90px; }
      .welcome-name { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="terminal">

  <!-- Title Bar -->
  <div class="t-bar">
    <div class="t-dots">
      <span class="t-dot r"></span>
      <span class="t-dot y"></span>
      <span class="t-dot g"></span>
    </div>
    <div class="t-title">~/matensy/portfolio</div>
    <div class="t-bar-spacer"></div>
  </div>

  <!-- Scroll Body -->
  <div class="t-body" id="t-body" onclick="focusInput()">
    <div id="output"></div>
    <div class="input-line">
      <span class="in-ps1">matensy@portfolio:~$</span>
      <input
        id="cmd-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="type a command..."
      >
    </div>
  </div>

  <!-- Footer Buttons -->
  <div class="t-footer">
    <span class="try-lbl">Try:</span>
    <button class="q-btn" onclick="runCommand('help')">help</button>
    <button class="q-btn" onclick="runCommand('about')">about</button>
    <button class="q-btn" onclick="runCommand('skills')">skills</button>
    <button class="q-btn" onclick="runCommand('projects')">projects</button>
    <button class="q-btn" onclick="runCommand('contact')">contact</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  const output = document.getElementById('output');
  const input  = document.getElementById('cmd-input');
  const body   = document.getElementById('t-body');

  let cmdHistory = [];
  let histIdx    = -1;

  // ── Helpers ──────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function scrollDown() {
    body.scrollTop = body.scrollHeight;
  }

  function block(cmd, html) {
    const el = document.createElement('div');
    el.className = 'out-block';
    el.innerHTML =
      `<div class="out-cmd-line">` +
        `<span class="out-ps1">matensy@portfolio:~$</span>` +
        `<span class="out-cmd">${esc(cmd)}</span>` +
      `</div>` +
      `<div>${html}</div>`;
    output.appendChild(el);
    scrollDown();
  }

  function kv(key, val) {
    return (
      `<div class="kv-row">` +
        `<span class="kv-key">${key}</span>` +
        `<span class="kv-sep">→</span>` +
        `<span class="kv-val">${val}</span>` +
      `</div>`
    );
  }

  function helpRow(cmd, desc) {
    return `<div class="help-row"><span class="help-cmd">${cmd}</span><span class="help-desc">${desc}</span></div>`;
  }

  function skillEntry(name) {
    return `<div class="skill-entry">${name}</div>`;
  }

  function proj(name, diff, topics) {
    const cls = 'diff-' + diff;
    const lbl = diff.charAt(0).toUpperCase() + diff.slice(1);
    return (
      `<div class="proj-item">` +
        `<div class="proj-header">` +
          `<span class="proj-name">${name}</span>` +
          `<span class="${cls}">[${lbl}]</span>` +
        `</div>` +
        `<div class="proj-topics">${topics}</div>` +
      `</div>`
    );
  }

  function docLink(name, href, meta) {
    return (
      `<div class="proj-item">` +
        `<div class="proj-header">` +
          `<a class="proj-name" href="${href}" target="_blank" rel="noopener">${name}</a>` +
          `<span class="diff-easy">[PDF]</span>` +
        `</div>` +
        `<div class="proj-topics">${meta}</div>` +
      `</div>`
    );
  }

  function expItem(role, company, period, bullets) {
    return (
      `<div class="exp-item">` +
        `<div class="exp-role">${role}</div>` +
        `<div class="exp-company">${company}</div>` +
        `<div class="exp-period">${period}</div>` +
        bullets.map(b => `<div class="exp-bullet">${b}</div>`).join('') +
      `</div>`
    );
  }

  // ── Commands ─────────────────────────────────────────────

  function cmdHelp() {
    block('help',
      `<div class="sec-title">Available Commands</div>` +
      helpRow('about',      'Who I am and what I do.') +
      helpRow('skills',     'Technical skills &amp; certifications.') +
      helpRow('projects',   'HTB machines I&apos;ve pwned.') +
      helpRow('experience', 'Professional experience.') +
      helpRow('contact',    'How to reach me.') +
      helpRow('clear',      'Clear the terminal.') +
      helpRow('help',       'Show this message.')
    );
  }

  function cmdAbout() {
    block('about',
      `<div class="sec-title">About</div>` +
      kv('Name',     'Matheus Henrique de Jesus') +
      kv('Handle',   'Matensy') +
      kv('Role',     'Cybersecurity Student &amp; HTB Player') +
      kv('Location', 'Ribeirão Preto, BR') +
      kv('Age',      '21') +
      kv('HTB Nick', 'Nugur1') +
      kv('HTB Rank', 'Top 39 BR') +
      kv('Discord',  '@Matensy') +
      kv('Degree',   'B.Sc. Computer Science — UNIP (2023–2026)') +
      `<div class="bio">` +
        `Apaixonado por segurança ofensiva e desafios CTF. Dedico meu tempo a estudar ` +
        `vulnerabilidades, explorar sistemas e subir no ranking do Hack The Box. ` +
        `Tenho um olhar crítico para resolver problemas e uma abordagem prática para aprender.<br><br>` +
        `Experiência em pentesting, análise de vulnerabilidades, cloud AWS e automação com Python.` +
      `</div>`
    );
  }

  function cmdSkills() {
    block('skills',
      `<div class="sec-title">Skills</div>` +

      `<div class="skill-group">` +
        `<div class="skill-group-title">Offensive Security</div>` +
        skillEntry('CTFs &amp; Hack The Box') +
        skillEntry('Vulnerability Research') +
        skillEntry('SQL Injection &amp; Web Hacking') +
        skillEntry('Reverse Engineering') +
        skillEntry('Social Engineering') +
      `</div>` +

      `<div class="skill-group">` +
        `<div class="skill-group-title">Infrastructure</div>` +
        skillEntry('Linux &amp; Networking') +
        skillEntry('AWS &amp; Cloud Services') +
        skillEntry('PowerShell &amp; Shell Scripting') +
        skillEntry('Python &amp; Data Processing') +
      `</div>` +

      `<div class="skill-group">` +
        `<div class="skill-group-title">Certifications</div>` +
        skillEntry('Google Cybersecurity') +
        skillEntry('The Complete Ethical Hacking Course: Beginner to Advanced') +
        skillEntry('Formação PowerShell: automatize suas tarefas') +
        skillEntry('Formação Shell Scripting: automatize tarefas') +
        skillEntry('Administração de Redes Windows') +
      `</div>`
    );
  }

  function cmdProjects() {
    block('projects',
      `<div class="sec-title">HTB Machines Pwned</div>` +
      proj('HTB Puppy',       'medium', 'Kerberos · LDAP · SMB · DCSync · DPAPI') +
      proj('HTB Fluffy',      'easy',   'SMB · Responder · Certipy · PKI · ShadowCredentials') +
      proj('HTB Editor',      'easy',   'XWiki · CVE-2025-24893 · Netdata') +
      proj('HTB WhiteRabbit', 'insane', 'SQL Injection · MD5 · PredictableRNG · Sudo') +

      `<div class="sec-title" style="margin-top:24px">Malware Analysis Reports</div>` +
      docLink('Kjnry.exe Analysis', 'assets/docs/kjnry-malware-analysis.pdf', '.NET Reactor v4 Protected Information Stealer') +
      docLink('ABC Malware Analysis',   'assets/docs/abc-malware-analysis.pdf',   'Static &amp; behavioral analysis report') +

      `<div class="sec-title" style="margin-top:24px">More</div>` +
      kv('CTF Writeups', '<a href="https://app.notion.com/p/2675985292f080c2992be4f9450ac607?v=2675985292f081cdb3f9000c4bff0b2b" target="_blank" rel="noopener">Notion — CTFs</a>') +
      kv('GitHub',       '<a href="https://github.com/Matensy/" target="_blank" rel="noopener">github.com/Matensy</a>')
    );
  }

  function cmdExperience() {
    block('experience',
      `<div class="sec-title">Professional Experience</div>` +

      expItem(
        'Estágio de Cibersegurança',
        'Adekz Tecnologia — Ribeirão Preto, SP',
        'Set 2025 – Mar 2026',
        [
          'Análise de vulnerabilidades e testes de penetração (Pentest)',
          'Implementação de práticas de segurança e monitoramento de infraestrutura',
          'Compliance e governança de TI junto às equipes de desenvolvimento',
        ]
      ) +

      expItem(
        'Estagiário de TI',
        'Compass UOL — Ribeirão Preto, SP',
        'Fev 2025 – Abr 2025',
        [
          'Desenvolvimento de soluções com Python para processamento de dados',
          'Big Data e análise de grandes volumes de informação',
          'AWS (Amazon Web Services) e pipelines de automação',
        ]
      ) +

      expItem(
        'Analista de SAC — Help Desk Salesforce',
        'Leroy Merlin — Ribeirão Preto, SP',
        'Dez 2023 – Jun 2024',
        [
          'Suporte técnico ao cliente via plataforma Salesforce',
          'Gestão de estornos e resolução de problemas pós-venda',
        ]
      ) +

      expItem(
        'Assistente de Gestão — TI',
        'Leroy Merlin — Ribeirão Preto, SP',
        'Ago 2023 – Nov 2023',
        [
          'Suporte em infraestrutura e sistemas internos',
          'Manutenção de equipamentos e resolução de problemas técnicos',
        ]
      )
    );
  }

  function cmdContact() {
    block('contact',
      `<div class="sec-title">Contact</div>` +
      kv('Email',    '<a href="mailto:matheuscolobino@hotmail.com">matheuscolobino@hotmail.com</a>') +
      kv('LinkedIn', '<a href="https://www.linkedin.com/in/matheus-henrique-de-jesus-1538b0248/" target="_blank" rel="noopener">linkedin.com/in/matheus-henrique...</a>') +
      kv('Discord',  'matensy') +
      kv('HTB',      '<a href="https://app.hackthebox.com/users/1645631" target="_blank" rel="noopener">Nugur1 — Top 39 BR</a>')
    );
  }

  function cmdClear() {
    output.innerHTML = '';
  }

  function cmdWhoami() {
    block('whoami',
      `<span>matensy — Cybersecurity Student &amp; HTB Player @ Ribeirão Preto, BR</span>`
    );
  }

  function cmdLs() {
    block('ls',
      `<span class="kv-key">about</span>&nbsp;&nbsp;` +
      `<span class="kv-key">skills</span>&nbsp;&nbsp;` +
      `<span class="kv-key">projects</span>&nbsp;&nbsp;` +
      `<span class="kv-key">experience</span>&nbsp;&nbsp;` +
      `<span class="kv-key">contact</span>`
    );
  }

  function cmdExit() {
    block('exit',
      `<span class="text-dim">There's no escaping this terminal. 👾</span>`
    );
  }

  // ── Dispatch ─────────────────────────────────────────────

  const CMDS = {
    help:       cmdHelp,
    about:      cmdAbout,
    skills:     cmdSkills,
    projects:   cmdProjects,
    experience: cmdExperience,
    contact:    cmdContact,
    clear:      cmdClear,
    whoami:     cmdWhoami,
    ls:         cmdLs,
    exit:       cmdExit,
  };

  function runCommand(cmd) {
    cmd = (cmd || '').trim().toLowerCase();
    input.value = '';
    histIdx = -1;

    if (!cmd) return;

    if (cmd !== 'clear') cmdHistory.unshift(cmd);

    if (CMDS[cmd]) {
      CMDS[cmd]();
    } else {
      block(cmd,
        `<span class="err">bash: ${esc(cmd)}: command not found — type <span style="color:var(--accent)">help</span> for available commands.</span>`
      );
    }

    focusInput();
  }

  window.runCommand = runCommand;

  function focusInput() {
    input.focus();
    scrollDown();
  }

  window.focusInput = focusInput;

  // ── Keyboard ─────────────────────────────────────────────

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      runCommand(input.value);

    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (histIdx < cmdHistory.length - 1) {
        histIdx++;
        input.value = cmdHistory[histIdx];
      }

    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx > 0) {
        histIdx--;
        input.value = cmdHistory[histIdx];
      } else {
        histIdx = -1;
        input.value = '';
      }

    } else if (e.key === 'Tab') {
      e.preventDefault();
      const partial = input.value.trim().toLowerCase();
      if (partial) {
        const matches = Object.keys(CMDS).filter(c => c.startsWith(partial));
        if (matches.length === 1) input.value = matches[0];
      }

    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      cmdClear();
    }
  });

  // ── Init ─────────────────────────────────────────────────

  (function showWelcome() {
    const el = document.createElement('div');
    el.className = 'out-block';
    el.innerHTML =
      `<div style="margin-bottom:20px">` +
        `<div class="welcome-name">Matensy</div>` +
        `<div class="welcome-role">Cybersecurity Student · HTB Player · Ribeirão Preto, BR</div>` +
        `<div class="welcome-hint">Type a command or click the shortcuts below.</div>` +
      `</div>`;
    output.appendChild(el);
  })();

  setTimeout(() => runCommand('help'), 250);
  setTimeout(focusInput, 300);

})();
</script>

</body>
</html>
